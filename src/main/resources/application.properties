# Server Configuration
server.port=8080

# Database Configuration (MySQL / XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/rcp_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Custom Java Socket Chat Server Configuration
rcp.socket.server.port=9090
rcp.socket.threadpool.size=20
